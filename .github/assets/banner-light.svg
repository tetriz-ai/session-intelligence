<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="session-intelligence: derive turns, phases, outcomes and security flags from a coding-agent session">
  <rect width="880" height="200" fill="#ffffff"/>
  <style>
    .name { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #111418; }
    .pitch { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #47505b; }
    .lbl { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #5b6570; }
    .raw { fill: #c7ccd3; }
    .chip { fill: #e8eef7; stroke: #b9c7dd; }
    .chiptxt { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #2b3a52; }
    .arrow { font: 400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #8a93a0; }
  </style>
  <text class="name" x="56" y="86">session-intelligence</text>
  <text class="pitch" x="56" y="118">Derive turns, phases, outcomes and security flags</text>
  <text class="pitch" x="56" y="140">from a coding-agent session transcript.</text>
  <!-- mark: raw transcript lines -> analysis chips -->
  <g transform="translate(600,58)">
    <rect class="raw" x="0" y="0" width="70" height="8" rx="4"/>
    <rect class="raw" x="0" y="18" width="52" height="8" rx="4"/>
    <rect class="raw" x="0" y="36" width="64" height="8" rx="4"/>
    <rect class="raw" x="0" y="54" width="44" height="8" rx="4"/>
    <text x="86" y="34" class="arrow">&#8594;</text>
    <g transform="translate(120,-6)">
      <rect class="chip" x="0" y="0" width="86" height="22" rx="11"/>
      <text class="chiptxt" x="12" y="15">turns</text>
      <rect class="chip" x="96" y="0" width="90" height="22" rx="11"/>
      <text class="chiptxt" x="108" y="15">phases</text>
      <rect class="chip" x="0" y="30" width="104" height="22" rx="11"/>
      <text class="chiptxt" x="12" y="45">outcomes</text>
      <rect class="chip" x="0" y="60" width="118" height="22" rx="11"/>
      <text class="chiptxt" x="12" y="75">security flags</text>
    </g>
  </g>
</svg>
