name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # The go.mod floor plus the two newest Go minors.
        go: ["1.25.0", "1.26.x", "1.27.x"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: session_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      POSTGRES_TEST_DSN: "host=localhost port=5432 user=postgres password=postgres dbname=session_intelligence_test sslmode=disable"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Load schema
        run: psql "$POSTGRES_TEST_DSN" -v ON_ERROR_STOP=1 -f migrations/latest.sql
      - run: go build ./... && go vet ./... && go test -race -count=1 ./...
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # golangci-lint v2.11.4 panics under Go 1.26+, so the lint job runs on 1.25.x.
          # Raise both together when a newer golangci-lint supports the newer toolchain.
          go-version: "1.25.x"
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.11.4
  generate:
    name: Generated code is up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.69.0
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install protoc-gen-go
        # Pinned to the google.golang.org/protobuf version in go.mod.
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - name: Regenerate
        run: |
          buf generate
          go generate ./...
      - name: Fail on drift
        run: git diff --exit-code
  vulncheck:
    name: Vulnerability check
    # Never a required pull-request check: a new advisory must not fail an unrelated change.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...
  examples:
    name: Examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
      - run: scripts/run-examples.sh
  reference-llm:
    name: reference-llm (Python)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: reference-llm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Install uv via its pinned standalone installer (uv then provisions the Python it
      # needs from requires-python). Pinned to match the Dockerfile's UV_VERSION.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.10.4/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
  reference-llm-smoke:
    name: reference-llm smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Postgres and the reference-llm service
        run: docker compose up -d --wait
      - name: Probe the health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/_health; then echo; exit 0; fi
            sleep 2
          done
          echo "reference-llm did not become healthy" >&2
          docker compose logs reference-llm
          exit 1
      - name: Stop the stack
        if: always()
        run: docker compose down -v
