syntax = "proto3";

package sessionintelligence.v1;

option go_package = "github.com/tetriz-ai/session-intelligence/gen/sessionintelligence/v1;sessionintelligencepb";

// conversation.proto contributes the reused telemetry types this file
// references by bare name (same package): SessionEventOutcome (a ToolCall's
// outcome) and the SessionEvent* family.
import "sessionintelligence/v1/conversation.proto";
// The coverage tool on SignalCoverageCell uses the canonical shared IDE enum,
// not the legacy session-local one (per conversation.proto's IdeType note).
import "sessionintelligence/common/v1/ide_type.proto";

// ─────────────────────────────────────────────────────────────────────────
// Appendix A — Enums (Session Analysis Engine)
//
// Every enum carries a *_UNSPECIFIED = 0 zero value per buf STANDARD
// (ENUM_ZERO_VALUE_SUFFIX). Where a value reads `none`/`unknown`/`unclear`,
// it is a real non-zero member ("we looked and could not tell"), distinct
// from the unset zero. Reused enums (SessionEventAuthor, SessionEventOutcome,
// the SessionToPR* family) live in the sibling protos and are not redefined
// here. WorkType and CoverageTool are not new enums: the work_type column
// reuses PhaseTheme and the coverage tool reuses the canonical shared
// sessionintelligence.common.v1.IdeType.
// ─────────────────────────────────────────────────────────────────────────

// ── Orchestration ──

// SessionAnalysisStatus is the lifecycle state of a session's analysis on the
// orchestration (state) table.
enum SessionAnalysisStatus {
 // SESSION_ANALYSIS_STATUS_UNSPECIFIED means the row has no state yet.
 SESSION_ANALYSIS_STATUS_UNSPECIFIED = 0;
 // SESSION_ANALYSIS_STATUS_PENDING means claimed for processing, not yet run.
 SESSION_ANALYSIS_STATUS_PENDING = 1;
 // SESSION_ANALYSIS_STATUS_SPINE_DONE means the free spine ran but no judged
 // producer has completed (e.g. every producer flag is off).
 SESSION_ANALYSIS_STATUS_SPINE_DONE = 2;
 // SESSION_ANALYSIS_STATUS_JUDGED means the judged tier resolved; the row is
 // servable (see judged_disposition for whether every producer ran).
 SESSION_ANALYSIS_STATUS_JUDGED = 3;
 // SESSION_ANALYSIS_STATUS_FAILED means processing errored; re-admitted on the
 // provider-outage retry path.
 SESSION_ANALYSIS_STATUS_FAILED = 4;
 // SESSION_ANALYSIS_STATUS_SUPERSEDED means an older generation replaced by a
 // live one under the same raw_record; excluded from serving.
 SESSION_ANALYSIS_STATUS_SUPERSEDED = 5;
 // SESSION_ANALYSIS_STATUS_SKIPPED means intentionally not analysed; every
 // skip is conditional and re-admitted when its condition changes (skip_reason).
 SESSION_ANALYSIS_STATUS_SKIPPED = 6;
}

// SessionAnalysisSkipReason is the closed vocabulary of why a session was
// SKIPPED; each reason names the re-admission condition that later revives it.
enum SessionAnalysisSkipReason {
 // SESSION_ANALYSIS_SKIP_REASON_UNSPECIFIED means no skip reason recorded.
 SESSION_ANALYSIS_SKIP_REASON_UNSPECIFIED = 0;
 // SESSION_ANALYSIS_SKIP_REASON_CHILD means a delegated child session folded
 // into its parent rather than analysed on its own.
 SESSION_ANALYSIS_SKIP_REASON_CHILD = 1;
 // SESSION_ANALYSIS_SKIP_REASON_NO_SEAT means the person held no seat at gate
 // time; re-admitted when they become seated.
 SESSION_ANALYSIS_SKIP_REASON_NO_SEAT = 2;
 // SESSION_ANALYSIS_SKIP_REASON_OUT_OF_WINDOW means the session predates the
 // plan's data window; re-admitted when the window cutoff moves.
 SESSION_ANALYSIS_SKIP_REASON_OUT_OF_WINDOW = 3;
 // SESSION_ANALYSIS_SKIP_REASON_REPO_UNTRACKED_METADATA means the session's
 // metadata repo is untracked; re-admitted when the repo becomes tracked.
 SESSION_ANALYSIS_SKIP_REASON_REPO_UNTRACKED_METADATA = 4;
 // SESSION_ANALYSIS_SKIP_REASON_REPO_UNTRACKED_PROJECT means the session's
 // project repo is untracked; re-admitted when the repo becomes tracked.
 SESSION_ANALYSIS_SKIP_REASON_REPO_UNTRACKED_PROJECT = 5;
}

// CallStatus is the per-producer outcome recorded in CallState — whether a
// judged producer (READ, EVIDENCE, DISCARD) ran for a session.
enum CallStatus {
 // CALL_STATUS_UNSPECIFIED means no status recorded for this producer yet.
 CALL_STATUS_UNSPECIFIED = 0;
 // CALL_STATUS_NOT_FIRED means the producer was conditional and had nothing to
 // do for this session (e.g. an evidence pass with no evidence).
 CALL_STATUS_NOT_FIRED = 1;
 // CALL_STATUS_DONE means the producer ran and committed its grain.
 CALL_STATUS_DONE = 2;
 // CALL_STATUS_FAILED means the producer's inference errored.
 CALL_STATUS_FAILED = 3;
 // CALL_STATUS_SKIPPED means the producer was not applicable to this session
 // for a non-flag reason.
 CALL_STATUS_SKIPPED = 4;
 // CALL_STATUS_FLAG_SKIPPED means the producer's rollout flag was off, so its
 // inference never ran; category 9 re-admits the row when the flag turns on.
 CALL_STATUS_FLAG_SKIPPED = 5;
 // CALL_STATUS_SKIPPED_PENDING_DATA means the producer fired but an input
 // dependency was not yet resolvable (an artifact whose intent the classify
 // sweep has not reached), so it committed no judged grain and is
 // re-admittable: the scan re-picks the row via the pending_data_producers bit
 // and a cheap intent read until the data resolves or the source body changes
 //. Distinct from CALL_STATUS_SKIPPED, which is
 // a settled non-flag absence that is never re-admitted on data arrival.
 CALL_STATUS_SKIPPED_PENDING_DATA = 6;
}

// JudgedDisposition records how the judged tier resolved, stamped alongside
// judged_at. All three still enter measured aggregates via NULL-tolerant
// per-field averaging.
enum JudgedDisposition {
 // JUDGED_DISPOSITION_UNSPECIFIED means the judged tier has not resolved yet.
 JUDGED_DISPOSITION_UNSPECIFIED = 0;
 // JUDGED_DISPOSITION_PRODUCED means every enabled producer ran.
 JUDGED_DISPOSITION_PRODUCED = 1;
 // JUDGED_DISPOSITION_PARTIAL means at least one producer was FLAG_SKIPPED, so
 // some judged columns are legitimately NULL.
 JUDGED_DISPOSITION_PARTIAL = 2;
 // JUDGED_DISPOSITION_NOT_APPLICABLE means thin-capture: no judged grain could
 // be produced.
 JUDGED_DISPOSITION_NOT_APPLICABLE = 3;
 // JUDGED_DISPOSITION_JUDGE_FAILED means R's terminal failure stamped judged_at
 // over the measured row already written at spine_done: the measured cost/token
 // columns serve through the ordinary NULL-tolerant path, while every judged
 // column stays NULL and so never enters the score/verdict/waste aggregates
 //.
 JUDGED_DISPOSITION_JUDGE_FAILED = 4;
}

// ProducerReadiness is the per-producer(-half) resolution state stamped on
// session_analyses beside judged_disposition:
// discard_disposition and the two E-half columns (evidence_artifact_disposition,
// evidence_roundtrip_disposition) all share this vocabulary.
enum ProducerReadiness {
 // PRODUCER_READINESS_UNSPECIFIED means no readiness recorded yet (the producer
 // has not committed for this generation).
 PRODUCER_READINESS_UNSPECIFIED = 0;
 // PRODUCER_READINESS_PRODUCED means the half resolved and committed its output.
 PRODUCER_READINESS_PRODUCED = 1;
 // PRODUCER_READINESS_SKIPPED_PENDING_DATA means the half fired but its input is
 // not yet resolvable (e.g. E's artifact half awaiting harness-intent
 // classification); it is re-admittable and re-evaluated once the data lands.
 PRODUCER_READINESS_SKIPPED_PENDING_DATA = 2;
 // PRODUCER_READINESS_FAILED means the half exhausted its retry cap without
 // producing valid output for this content — terminal until a content change
 // re-admits it.
 PRODUCER_READINESS_FAILED = 3;
 // PRODUCER_READINESS_NOT_APPLICABLE means the half ran and found nothing to
 // adjudicate (a settled, complete absence — e.g. no evidence for E, no
 // revert/abandon signal for D) rather than a pending or failed state.
 PRODUCER_READINESS_NOT_APPLICABLE = 4;
}

// ── Capabilities (what a session's capture supports) ──

// TokenSplitCapability grades how completely the capture reports the token
// input/output/cache split.
enum TokenSplitCapability {
 // TOKEN_SPLIT_CAPABILITY_UNSPECIFIED means capability not assessed.
 TOKEN_SPLIT_CAPABILITY_UNSPECIFIED = 0;
 // TOKEN_SPLIT_CAPABILITY_FULL means the complete split is reported.
 TOKEN_SPLIT_CAPABILITY_FULL = 1;
 // TOKEN_SPLIT_CAPABILITY_PARTIAL means some split fields are reported.
 TOKEN_SPLIT_CAPABILITY_PARTIAL = 2;
 // TOKEN_SPLIT_CAPABILITY_NONE means no split is reported.
 TOKEN_SPLIT_CAPABILITY_NONE = 3;
 // TOKEN_SPLIT_CAPABILITY_ESTIMATED means the split is estimated, not measured.
 TOKEN_SPLIT_CAPABILITY_ESTIMATED = 4;
}

// ToolOutcomeCapability grades how a session's capture reports tool-call
// outcomes.
enum ToolOutcomeCapability {
 // TOOL_OUTCOME_CAPABILITY_UNSPECIFIED means capability not assessed.
 TOOL_OUTCOME_CAPABILITY_UNSPECIFIED = 0;
 // TOOL_OUTCOME_CAPABILITY_TYPED means per-call typed outcomes are reported.
 TOOL_OUTCOME_CAPABILITY_TYPED = 1;
 // TOOL_OUTCOME_CAPABILITY_AGGREGATE means only aggregate tool counts exist.
 TOOL_OUTCOME_CAPABILITY_AGGREGATE = 2;
 // TOOL_OUTCOME_CAPABILITY_NONE means no tool outcomes are reported.
 TOOL_OUTCOME_CAPABILITY_NONE = 3;
}

// ReasoningTraceCapability grades how a session's capture exposes the model's
// reasoning trace.
enum ReasoningTraceCapability {
 // REASONING_TRACE_CAPABILITY_UNSPECIFIED means capability not assessed.
 REASONING_TRACE_CAPABILITY_UNSPECIFIED = 0;
 // REASONING_TRACE_CAPABILITY_FULL means the full reasoning trace is available.
 REASONING_TRACE_CAPABILITY_FULL = 1;
 // REASONING_TRACE_CAPABILITY_REDACTED means the trace is present but redacted.
 REASONING_TRACE_CAPABILITY_REDACTED = 2;
 // REASONING_TRACE_CAPABILITY_NONE means no reasoning trace is available.
 REASONING_TRACE_CAPABILITY_NONE = 3;
}

// AssistantTextCapability grades how completely the assistant's own text is
// captured for a session.
enum AssistantTextCapability {
 // ASSISTANT_TEXT_CAPABILITY_UNSPECIFIED means capability not assessed.
 ASSISTANT_TEXT_CAPABILITY_UNSPECIFIED = 0;
 // ASSISTANT_TEXT_CAPABILITY_FULL means assistant text is fully captured.
 ASSISTANT_TEXT_CAPABILITY_FULL = 1;
 // ASSISTANT_TEXT_CAPABILITY_PARTIAL means assistant text is partly captured.
 ASSISTANT_TEXT_CAPABILITY_PARTIAL = 2;
 // ASSISTANT_TEXT_CAPABILITY_NONE means assistant text is not captured.
 ASSISTANT_TEXT_CAPABILITY_NONE = 3;
}

// ── Session verdict ──

// SessionSteering grades how actively the human steered the session overall.
enum SessionSteering {
 // SESSION_STEERING_UNSPECIFIED means not judged.
 SESSION_STEERING_UNSPECIFIED = 0;
 // SESSION_STEERING_MOSTLY_ACTIVE means the human drove almost throughout.
 SESSION_STEERING_MOSTLY_ACTIVE = 1;
 // SESSION_STEERING_ACTIVE means the human steered actively.
 SESSION_STEERING_ACTIVE = 2;
 // SESSION_STEERING_MIDDLING means steering was mixed.
 SESSION_STEERING_MIDDLING = 3;
 // SESSION_STEERING_SLIGHTLY_PASSIVE means the human mostly let the agent run.
 SESSION_STEERING_SLIGHTLY_PASSIVE = 4;
 // SESSION_STEERING_MOSTLY_PASSIVE means the human barely steered.
 SESSION_STEERING_MOSTLY_PASSIVE = 5;
}

// GoalAchieved grades how fully the session met its goal.
enum GoalAchieved {
 // GOAL_ACHIEVED_UNSPECIFIED means not judged.
 GOAL_ACHIEVED_UNSPECIFIED = 0;
 // GOAL_ACHIEVED_FULLY means the goal was fully met.
 GOAL_ACHIEVED_FULLY = 1;
 // GOAL_ACHIEVED_SOMEWHAT means the goal was largely met.
 GOAL_ACHIEVED_SOMEWHAT = 2;
 // GOAL_ACHIEVED_PARTIALLY means the goal was partly met.
 GOAL_ACHIEVED_PARTIALLY = 3;
 // GOAL_ACHIEVED_BARELY means little of the goal was met.
 GOAL_ACHIEVED_BARELY = 4;
 // GOAL_ACHIEVED_NO means the goal was not met.
 GOAL_ACHIEVED_NO = 5;
}

// Smoothness grades how friction-free the session (or phase) felt.
enum Smoothness {
 // SMOOTHNESS_UNSPECIFIED means not judged.
 SMOOTHNESS_UNSPECIFIED = 0;
 // SMOOTHNESS_SMOOTH means the work flowed without notable friction.
 SMOOTHNESS_SMOOTH = 1;
 // SMOOTHNESS_SOME_FRICTION means occasional friction slowed the work.
 SMOOTHNESS_SOME_FRICTION = 2;
 // SMOOTHNESS_ROUGH means friction dominated.
 SMOOTHNESS_ROUGH = 3;
 // SMOOTHNESS_UNCLEAR means smoothness could not be determined.
 SMOOTHNESS_UNCLEAR = 4;
}

// FrictionCause attributes the dominant source of friction in a session or
// phase.
enum FrictionCause {
 // FRICTION_CAUSE_UNSPECIFIED means not judged.
 FRICTION_CAUSE_UNSPECIFIED = 0;
 // FRICTION_CAUSE_NONE means no notable friction occurred.
 FRICTION_CAUSE_NONE = 1;
 // FRICTION_CAUSE_HARNESS means the harness (tools/config) caused the friction.
 FRICTION_CAUSE_HARNESS = 2;
 // FRICTION_CAUSE_MODEL means the model's behaviour caused the friction.
 FRICTION_CAUSE_MODEL = 3;
 // FRICTION_CAUSE_PROMPT means the human's prompting caused the friction.
 FRICTION_CAUSE_PROMPT = 4;
 // FRICTION_CAUSE_APPROACH means the chosen approach caused the friction.
 FRICTION_CAUSE_APPROACH = 5;
 // FRICTION_CAUSE_UNKNOWN means friction occurred but its cause is unclear.
 FRICTION_CAUSE_UNKNOWN = 6;
}

// Speed grades the session's perceived pace.
enum Speed {
 // SPEED_UNSPECIFIED means not judged.
 SPEED_UNSPECIFIED = 0;
 // SPEED_FAST means the work moved quickly.
 SPEED_FAST = 1;
 // SPEED_SLOW means the work moved slowly.
 SPEED_SLOW = 2;
 // SPEED_UNKNOWN means pace could not be determined.
 SPEED_UNKNOWN = 3;
}

// TokenEfficiency grades how economically the session spent tokens.
enum TokenEfficiency {
 // TOKEN_EFFICIENCY_UNSPECIFIED means not judged.
 TOKEN_EFFICIENCY_UNSPECIFIED = 0;
 // TOKEN_EFFICIENCY_EFFICIENT means tokens were spent economically.
 TOKEN_EFFICIENCY_EFFICIENT = 1;
 // TOKEN_EFFICIENCY_WASTEFUL means tokens were spent wastefully.
 TOKEN_EFFICIENCY_WASTEFUL = 2;
 // TOKEN_EFFICIENCY_UNKNOWN means efficiency could not be determined.
 TOKEN_EFFICIENCY_UNKNOWN = 3;
}

// ── Turn ──

// PromptType classifies what a single human turn was asking for.
enum PromptType {
 // PROMPT_TYPE_UNSPECIFIED means not classified.
 PROMPT_TYPE_UNSPECIFIED = 0;
 // PROMPT_TYPE_EXPLORATION_ASK means an open-ended exploratory question.
 PROMPT_TYPE_EXPLORATION_ASK = 1;
 // PROMPT_TYPE_PLANNING means a request to plan or design.
 PROMPT_TYPE_PLANNING = 2;
 // PROMPT_TYPE_DECISION_MAKING means a request to choose between options.
 PROMPT_TYPE_DECISION_MAKING = 3;
 // PROMPT_TYPE_CREATION means a request to produce an artifact (code, doc).
 PROMPT_TYPE_CREATION = 4;
 // PROMPT_TYPE_REVIEW means a request to review or critique.
 PROMPT_TYPE_REVIEW = 5;
 // PROMPT_TYPE_OPERATIONAL_ASK means a request to run/operate something.
 PROMPT_TYPE_OPERATIONAL_ASK = 6;
 // PROMPT_TYPE_CONTEXT_ENRICHMENT means the turn supplied context, not a task.
 PROMPT_TYPE_CONTEXT_ENRICHMENT = 7;
 // PROMPT_TYPE_DATA_QUERY means a request to fetch or look up data.
 PROMPT_TYPE_DATA_QUERY = 8;
 // PROMPT_TYPE_STATUS_UPDATE means a status/acknowledgement turn.
 PROMPT_TYPE_STATUS_UPDATE = 9;
 // PROMPT_TYPE_TRIVIAL means a trivial or filler turn.
 PROMPT_TYPE_TRIVIAL = 10;
}

// TurnUserSteering grades how the human steered within a single turn.
enum TurnUserSteering {
 // TURN_USER_STEERING_UNSPECIFIED means not judged.
 TURN_USER_STEERING_UNSPECIFIED = 0;
 // TURN_USER_STEERING_ACTIVE means the human actively directed the turn.
 TURN_USER_STEERING_ACTIVE = 1;
 // TURN_USER_STEERING_CORRECTING means the human corrected the agent.
 TURN_USER_STEERING_CORRECTING = 2;
 // TURN_USER_STEERING_PASSIVE means the human let the agent proceed.
 TURN_USER_STEERING_PASSIVE = 3;
}

// PromptCompleteness grades how completely a prompt stated what it needed.
enum PromptCompleteness {
 // PROMPT_COMPLETENESS_UNSPECIFIED means not judged.
 PROMPT_COMPLETENESS_UNSPECIFIED = 0;
 // PROMPT_COMPLETENESS_COMPLETE means the prompt was self-sufficient.
 PROMPT_COMPLETENESS_COMPLETE = 1;
 // PROMPT_COMPLETENESS_MISSING_INFO means the prompt omitted needed info.
 PROMPT_COMPLETENESS_MISSING_INFO = 2;
 // PROMPT_COMPLETENESS_AMBIGUOUS means the prompt was ambiguous.
 PROMPT_COMPLETENESS_AMBIGUOUS = 3;
 // PROMPT_COMPLETENESS_NOT_APPLICABLE means completeness does not apply.
 PROMPT_COMPLETENESS_NOT_APPLICABLE = 4;
 // PROMPT_COMPLETENESS_UNRESOLVED means completeness could not be determined.
 PROMPT_COMPLETENESS_UNRESOLVED = 5;
}

// PromptObjectiveMet grades whether the turn met its own objective.
enum PromptObjectiveMet {
 // PROMPT_OBJECTIVE_MET_UNSPECIFIED means not judged.
 PROMPT_OBJECTIVE_MET_UNSPECIFIED = 0;
 // PROMPT_OBJECTIVE_MET_MET means the objective was met.
 PROMPT_OBJECTIVE_MET_MET = 1;
 // PROMPT_OBJECTIVE_MET_PARTIALLY_MET means the objective was partly met.
 PROMPT_OBJECTIVE_MET_PARTIALLY_MET = 2;
 // PROMPT_OBJECTIVE_MET_NOT_MET means the objective was not met.
 PROMPT_OBJECTIVE_MET_NOT_MET = 3;
 // PROMPT_OBJECTIVE_MET_UNCLEAR means it could not be determined.
 PROMPT_OBJECTIVE_MET_UNCLEAR = 4;
 // PROMPT_OBJECTIVE_MET_NOT_APPLICABLE means the turn had no objective to meet.
 PROMPT_OBJECTIVE_MET_NOT_APPLICABLE = 5;
}

// AgentHelpfulness grades how helpful the agent's response was in a turn or
// phase.
enum AgentHelpfulness {
 // AGENT_HELPFULNESS_UNSPECIFIED means not judged.
 AGENT_HELPFULNESS_UNSPECIFIED = 0;
 // AGENT_HELPFULNESS_HELPFUL means the response was helpful.
 AGENT_HELPFULNESS_HELPFUL = 1;
 // AGENT_HELPFULNESS_PARTIALLY_HELPFUL means the response was partly helpful.
 AGENT_HELPFULNESS_PARTIALLY_HELPFUL = 2;
 // AGENT_HELPFULNESS_UNHELPFUL means the response was unhelpful.
 AGENT_HELPFULNESS_UNHELPFUL = 3;
 // AGENT_HELPFULNESS_BLOCKED_BY_LIMITATION means a tool/model limitation
 // blocked the agent from helping.
 AGENT_HELPFULNESS_BLOCKED_BY_LIMITATION = 4;
 // AGENT_HELPFULNESS_UNCLEAR means helpfulness could not be determined.
 AGENT_HELPFULNESS_UNCLEAR = 5;
}

// AgentInitiative grades how the agent handled the gap between spec and action.
enum AgentInitiative {
 // AGENT_INITIATIVE_UNSPECIFIED means not judged.
 AGENT_INITIATIVE_UNSPECIFIED = 0;
 // AGENT_INITIATIVE_FOLLOWED_SPEC means the agent followed the stated spec.
 AGENT_INITIATIVE_FOLLOWED_SPEC = 1;
 // AGENT_INITIATIVE_ASKED_TO_CONFIRM means the agent paused to confirm.
 AGENT_INITIATIVE_ASKED_TO_CONFIRM = 2;
 // AGENT_INITIATIVE_REFUSED_TO_PROCEED means the agent declined to proceed.
 AGENT_INITIATIVE_REFUSED_TO_PROCEED = 3;
 // AGENT_INITIATIVE_ASSUMED_AND_PROCEEDED means the agent assumed and acted.
 AGENT_INITIATIVE_ASSUMED_AND_PROCEEDED = 4;
 // AGENT_INITIATIVE_UNCLEAR means initiative could not be determined.
 AGENT_INITIATIVE_UNCLEAR = 5;
}

// ToolUse grades whether the agent used tools appropriately in a turn.
enum ToolUse {
 // TOOL_USE_UNSPECIFIED means not judged.
 TOOL_USE_UNSPECIFIED = 0;
 // TOOL_USE_APPROPRIATE means tools were used appropriately.
 TOOL_USE_APPROPRIATE = 1;
 // TOOL_USE_SKILL_SHOULD_HAVE_BEEN_USED means a skill/command would have fit
 // better than the ad-hoc tool use.
 TOOL_USE_SKILL_SHOULD_HAVE_BEEN_USED = 2;
 // TOOL_USE_INADEQUATE means tool use fell short of what the turn needed.
 TOOL_USE_INADEQUATE = 3;
 // TOOL_USE_OVERUSED means tools were used more than necessary.
 TOOL_USE_OVERUSED = 4;
 // TOOL_USE_UNCLEAR means tool-use adequacy could not be determined.
 TOOL_USE_UNCLEAR = 5;
}

// WasRetry classifies whether a turn retried an earlier attempt.
enum WasRetry {
 // WAS_RETRY_UNSPECIFIED means not classified.
 WAS_RETRY_UNSPECIFIED = 0;
 // WAS_RETRY_FRESH means a new attempt, not a retry.
 WAS_RETRY_FRESH = 1;
 // WAS_RETRY_RETRY_SAME means a retry of the same request unchanged.
 WAS_RETRY_RETRY_SAME = 2;
 // WAS_RETRY_RETRY_REFINED means a retry with a refined request.
 WAS_RETRY_RETRY_REFINED = 3;
}

// FailureClass classifies the nature of a turn's failure.
enum FailureClass {
 // FAILURE_CLASS_UNSPECIFIED means not classified.
 FAILURE_CLASS_UNSPECIFIED = 0;
 // FAILURE_CLASS_NONE means the turn did not fail.
 FAILURE_CLASS_NONE = 1;
 // FAILURE_CLASS_TRANSIENT means a transient failure (retryable).
 FAILURE_CLASS_TRANSIENT = 2;
 // FAILURE_CLASS_HARD means a hard failure (not retryable as-is).
 FAILURE_CLASS_HARD = 3;
}

// TokenLocus attributes where a turn's tokens were spent. The model emits the
// five judged loci; code stamps HUMAN_INPUT and TOOL_RESULTS.
enum TokenLocus {
 // TOKEN_LOCUS_UNSPECIFIED means not attributed.
 TOKEN_LOCUS_UNSPECIFIED = 0;
 // TOKEN_LOCUS_HUMAN_INPUT means tokens spent on the human's input
 // (code-stamped).
 TOKEN_LOCUS_HUMAN_INPUT = 1;
 // TOKEN_LOCUS_AGENT_REASONING means tokens spent on the agent's reasoning.
 TOKEN_LOCUS_AGENT_REASONING = 2;
 // TOKEN_LOCUS_TOOL_RESULTS means tokens spent carrying tool results
 // (code-stamped).
 TOKEN_LOCUS_TOOL_RESULTS = 3;
 // TOKEN_LOCUS_CONTEXT_REESTABLISHMENT means tokens spent re-establishing
 // context (e.g. after compaction).
 TOKEN_LOCUS_CONTEXT_REESTABLISHMENT = 4;
 // TOKEN_LOCUS_SUBAGENT_FANOUT means tokens spent on delegated subagents.
 TOKEN_LOCUS_SUBAGENT_FANOUT = 5;
 // TOKEN_LOCUS_RETRY means tokens spent on retries.
 TOKEN_LOCUS_RETRY = 6;
 // TOKEN_LOCUS_UNKNOWN means the locus could not be determined.
 TOKEN_LOCUS_UNKNOWN = 7;
}

// WasteCause attributes why a turn wasted tokens.
enum WasteCause {
 // WASTE_CAUSE_UNSPECIFIED means not attributed.
 WASTE_CAUSE_UNSPECIFIED = 0;
 // WASTE_CAUSE_NONE means no waste occurred.
 WASTE_CAUSE_NONE = 1;
 // WASTE_CAUSE_REDUNDANT_REREAD means the same content was re-read needlessly.
 WASTE_CAUSE_REDUNDANT_REREAD = 2;
 // WASTE_CAUSE_OVER_FETCH means more context was fetched than needed.
 WASTE_CAUSE_OVER_FETCH = 3;
 // WASTE_CAUSE_WRONG_MODEL_TIER means an over-powered model tier was used.
 WASTE_CAUSE_WRONG_MODEL_TIER = 4;
 // WASTE_CAUSE_POOR_DECOMPOSITION means poor task decomposition wasted tokens.
 WASTE_CAUSE_POOR_DECOMPOSITION = 5;
 // WASTE_CAUSE_MISSING_MEMORY means absent memory forced re-derivation.
 WASTE_CAUSE_MISSING_MEMORY = 6;
}

// DecisionType classifies the kind of decision a turn made.
enum DecisionType {
 // DECISION_TYPE_UNSPECIFIED means not classified.
 DECISION_TYPE_UNSPECIFIED = 0;
 // DECISION_TYPE_APPROACH means a decision about the overall approach.
 DECISION_TYPE_APPROACH = 1;
 // DECISION_TYPE_API_OR_LIBRARY means a choice of API or library.
 DECISION_TYPE_API_OR_LIBRARY = 2;
 // DECISION_TYPE_DATA_SHAPE means a decision about data shape or schema.
 DECISION_TYPE_DATA_SHAPE = 3;
 // DECISION_TYPE_SCOPE_BOUNDARY means a decision about scope boundaries.
 DECISION_TYPE_SCOPE_BOUNDARY = 4;
 // DECISION_TYPE_INTENT_ASSUMPTION means an assumption about intent.
 DECISION_TYPE_INTENT_ASSUMPTION = 5;
}

// DownstreamImpact classifies how a turn's decision affected later work.
enum DownstreamImpact {
 // DOWNSTREAM_IMPACT_UNSPECIFIED means not classified.
 DOWNSTREAM_IMPACT_UNSPECIFIED = 0;
 // DOWNSTREAM_IMPACT_BUILT_ON means later work built on it.
 DOWNSTREAM_IMPACT_BUILT_ON = 1;
 // DOWNSTREAM_IMPACT_BENIGN means it had no material downstream effect.
 DOWNSTREAM_IMPACT_BENIGN = 2;
 // DOWNSTREAM_IMPACT_CORRECTED means later work corrected it.
 DOWNSTREAM_IMPACT_CORRECTED = 3;
 // DOWNSTREAM_IMPACT_DRIFTED means later work drifted because of it.
 DOWNSTREAM_IMPACT_DRIFTED = 4;
 // DOWNSTREAM_IMPACT_UNKNOWN means the downstream impact is unclear.
 DOWNSTREAM_IMPACT_UNKNOWN = 5;
}

// FeedbackTarget classifies what a human's feedback turn was aimed at.
enum FeedbackTarget {
 // FEEDBACK_TARGET_UNSPECIFIED means not classified.
 FEEDBACK_TARGET_UNSPECIFIED = 0;
