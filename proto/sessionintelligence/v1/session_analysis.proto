// than dropped, so an unknown value stays queryable.
enum SessionOutcome {
 // SESSION_OUTCOME_UNSPECIFIED means unset or an unmapped passthrough token.
 SESSION_OUTCOME_UNSPECIFIED = 0;
 // SESSION_OUTCOME_FULLY_ACHIEVED means the session fully achieved its goal.
 SESSION_OUTCOME_FULLY_ACHIEVED = 1;
 // SESSION_OUTCOME_MOSTLY_ACHIEVED means it mostly achieved its goal.
 SESSION_OUTCOME_MOSTLY_ACHIEVED = 2;
 // SESSION_OUTCOME_PARTIALLY_ACHIEVED means it partly achieved its goal.
 SESSION_OUTCOME_PARTIALLY_ACHIEVED = 3;
 // SESSION_OUTCOME_NOT_ACHIEVED means it did not achieve its goal.
 SESSION_OUTCOME_NOT_ACHIEVED = 4;
 // SESSION_OUTCOME_ABANDONED means the session was abandoned.
 SESSION_OUTCOME_ABANDONED = 5;
}

// PlanTierOrigin records how a session's plan tier was obtained. The tier
// string itself is an open vendor pass-through (text); this is its queryable
// dimension.
enum PlanTierOrigin {
 // PLAN_TIER_ORIGIN_UNSPECIFIED means origin not recorded.
 PLAN_TIER_ORIGIN_UNSPECIFIED = 0;
 // PLAN_TIER_ORIGIN_REPORTED means the tier was reported by the vendor.
 PLAN_TIER_ORIGIN_REPORTED = 1;
 // PLAN_TIER_ORIGIN_INFERRED means the tier was inferred, not reported.
 PLAN_TIER_ORIGIN_INFERRED = 2;
}

// SessionAnalysisOrigin marks how a session row was produced: by the live engine,
// or carried over by the session copy migration.
enum SessionAnalysisOrigin {
 // SESSION_ANALYSIS_ORIGIN_UNSPECIFIED is the proto3 zero; an unstamped row stores
 // NULL and deserializes to nil, not this value.
 SESSION_ANALYSIS_ORIGIN_UNSPECIFIED = 0;
 // SESSION_ANALYSIS_ORIGIN_LIVE means the live engine produced the row.
 SESSION_ANALYSIS_ORIGIN_LIVE = 1;
 // SESSION_ANALYSIS_ORIGIN_COPY means the session copy migration carried
 // the row over; a copied row is frozen history, not re-judged by the live engine.
 SESSION_ANALYSIS_ORIGIN_COPY = 2;
}

// ─────────────────────────────────────────────────────────────────────────
// Appendix B — JSONB proto messages (protojson)
// ─────────────────────────────────────────────────────────────────────────

// CallStateMap holds the per-producer analysis state, keyed READ · EVIDENCE ·
// DISCARD. Read whole and decoded in code — never SQL-filtered — so a later
// producer re-split needs no migration.
message CallStateMap {
 // calls maps each producer key (READ, EVIDENCE, DISCARD) to its CallState.
 map<string, CallState> calls = 1;
}

// CallState is one producer's analysis state within CallStateMap.
message CallState {
 // input_hash is the digest of the inputs this producer last ran against;
 // drives content-change re-runs.
 string input_hash = 1;
 // contract_version is this producer's contract version at its last run;
 // mirrored to a flat scalar for the SQL contract-behind scan.
 int32 contract_version = 2;
 // status is whether this producer ran, failed, was skipped, or was
 // flag-skipped.
 CallStatus status = 3;
 // pending_artifact_ids are the exact unresolved artifact ids this producer is
 // waiting on while status is CALL_STATUS_SKIPPED_PENDING_DATA — the persisted
 // dependency so a re-pick reads only those artifacts' classification rows,
 // never the S3 body. Empty otherwise. Decoded
 // whole in code, never SQL-filtered.
 repeated string pending_artifact_ids = 4;
 // source_content_sha256 is the spine's body digest captured when this producer
 // went CALL_STATUS_SKIPPED_PENDING_DATA; a re-pick abandons the
 // pending_artifact_ids snapshot and re-runs in full when the current body
 // digest differs (the conversation was re-uploaded), so it never trusts a
 // stale dependency set. Empty otherwise.
 string source_content_sha256 = 5;
}

// AnalysisTokenBreakdown is the input/output/cache token split for a turn or
// session. Named to avoid colliding with the sibling TokenBreakdown, which has
// a different (category/tokens/description) shape. Fidelity is carried by the
// flat token_fidelity column, not a field here.
message AnalysisTokenBreakdown {
 // input_tokens is the un-cached, billed-at-input-rate token count.
 int64 input_tokens = 1;
 // output_tokens is the generated token count.
 int64 output_tokens = 2;
 // cache_read_tokens is the count served from cache.
 int64 cache_read_tokens = 3;
 // cache_write_tokens is the count written to cache.
 int64 cache_write_tokens = 4;
 // cache_creation_5m_input_tokens is the count written to the 5-minute
 // ephemeral cache.
 int64 cache_creation_5m_input_tokens = 5;
 // cache_creation_1h_input_tokens is the count written to the 1-hour ephemeral
 // cache.
 int64 cache_creation_1h_input_tokens = 6;
 // reasoning_output_tokens is the count spent on reasoning output.
 int64 reasoning_output_tokens = 7;
 // total_tokens is the total token count for the turn or session.
 int64 total_tokens = 8;
 // service_tier is the vendor service tier the call ran under.
 string service_tier = 9;
 // estimated_tokens is the estimated total when a measured count is
 // unavailable; unset when tokens are measured. Vendor billing units (e.g. Kiro's
 // fractional credits) are the flat session_turn_analyses.native_billing_units
 // column, not a field here — one canonical, aggregation-friendly home.
 optional int64 estimated_tokens = 10;
}

// ToolCall is one tool invocation within a turn.
message ToolCall {
 // name is the tool name (e.g. "Bash", "Read").
 string name = 1;
 // call_id is the vendor's identifier for this invocation.
 string call_id = 2;
 // outcome is the invocation's outcome.
 SessionEventOutcome outcome = 3;
 // failure_kind categorizes a failure; empty when the call did not fail.
 string failure_kind = 4;
}

// FrictionCounts tallies friction events by type for a session or phase.
message FrictionCounts {
 // counts maps a friction-event type to its occurrence count.
 map<string, int32> counts = 1;
}

// StringList wraps a repeated string for use as a JSONB column payload; the
// column name carries the semantics, so it is reused across many columns
// (languages, models_used, went_well, and the like). files_touched is NOT one
// of them — it carries the richer FileTouchList (read/edited per file).
// TouchKind distinguishes a file a turn read from one it edited.
enum TouchKind {
 // TOUCH_KIND_UNSPECIFIED means the touch kind was not recorded.
 TOUCH_KIND_UNSPECIFIED = 0;
 // TOUCH_KIND_READ means the turn read the file, not edited it.
 TOUCH_KIND_READ = 1;
 // TOUCH_KIND_EDITED means the turn wrote to the file.
 TOUCH_KIND_EDITED = 2;
}

// FileTouch is one file a turn touched, with how it was touched.
message FileTouch {
 // path is the file path, redacted to the repo-relative form on the device.
 string path = 1;
 // touch_kind is read vs edited; UNSPECIFIED when the source did not say.
 TouchKind touch_kind = 2;
}

// FileTouchList is the read/edited file set for a turn (session-turn-telemetry
// design) — the richer files-touched jsonb shape, distinct from the names-only
// StringList.
message FileTouchList {
 // items is the turn's set of touched files, one entry per file.
 repeated FileTouch items = 1;
}

message StringList {
 // values is the list of strings; the owning column names what they are.
 repeated string values = 1;
}

// List-wrapper messages for the repeated-element JSONB columns. A JSONB column
// stores a protojson-marshalled proto MESSAGE, and protojson cannot
// marshal a bare repeated field at the top level, so a plural column wraps its
// elements in a single-field list message (the same shape as StringList).
message ToolCallList {
 // items is the turn's tool calls (the tools column).
 repeated ToolCall items = 1;
}

// TurnModel is one model that served a turn, with the reasoning effort it ran at. Effort is
// carried here per model rather than in a flat column so a turn that used more than one model
// keeps each model's effort; the owning column is models.
message TurnModel {
 // model is the model that served the turn, verbatim (may be a router alias such as "auto").
 string model = 1;
 // effort is the reasoning effort the model ran at (vendor token, e.g. "high"); empty when the
 // surface does not report it.
 string effort = 2;
}

// TurnModelList wraps a turn's models and their per-model effort as one JSONB message.
message TurnModelList {
 // items is the turn's models with their efforts (the models column).
 repeated TurnModel items = 1;
}

// PromptIssueList wraps a turn's prompt-quality and leak issues so the repeated
// value round-trips as a single JSONB message.
message PromptIssueList {
 // items is the turn's prompt-quality/leak issues (the prompt_issues column).
 repeated PromptIssue items = 1;
}

// PhaseCoachingList wraps a phase's coaching notes as one JSONB message.
message PhaseCoachingList {
 // items is the phase's coaching notes (the coaching column).
 repeated PhaseCoaching items = 1;
}

// InvokedSkillJudgmentList wraps a session's per-invoked-skill judgments as one JSONB message.
message InvokedSkillJudgmentList {
 // items is the session's per-skill judgments (the invoked_skills column).
 repeated InvokedSkillJudgment items = 1;
}

// ArtifactAdjudicationList wraps a session's artifact adjudications as one JSONB message.
message ArtifactAdjudicationList {
 // items is the session's artifact adjudications (the artifact_adjudications column).
 repeated ArtifactAdjudication items = 1;
}

// HarnessFindingList wraps a session's harness findings as one JSONB message.
message HarnessFindingList {
 // items is the session's harness findings (the harness_findings column).
 repeated HarnessFinding items = 1;
}

// DiscardedRangeList wraps a session's discarded work ranges as one JSONB message.
message DiscardedRangeList {
 // items is the session's discarded work ranges (the discarded_ranges column).
 repeated DiscardedRange items = 1;
}

// SignalCoverageList wraps a session's signal-coverage cells as one JSONB message.
message SignalCoverageList {
 // items is the session's signal-coverage cells (the signal_coverage column).
 repeated SignalCoverageCell items = 1;
}

// PromptIssue is one prompt-quality (or leak) issue found in a turn.
message PromptIssue {
 // slug identifies the issue from the closed vocabulary.
 PromptIssueSlug slug = 1;
 // severity grades the issue.
 IssueSeverity severity = 2;
 // layer names the prompt layer the issue sits in.
 string layer = 3;
 // note is a short free-text description of the issue.
 string note = 4;
}

// SdlcStageSet is the lean set of SDLC stages a phase touched (no transitions
// sub-array).
message SdlcStageSet {
 // stages is the set of SDLC stages the phase touched.
 repeated SdlcStage stages = 1;
}

// PhaseCoaching is one coaching suggestion attached to a phase.
message PhaseCoaching {
 // root_cause is the diagnosed root cause the suggestion addresses.
 string root_cause = 1;
 // suggestion is the coaching suggestion text.
 string suggestion = 2;
 // target is what the suggestion targets (e.g. a practice or artifact).
 string target = 3;
 // lever is the coaching lever the suggestion pulls.
 CoachingLever lever = 4;
 // axes are the improvement dimensions the suggestion aims at.
 repeated CoachingAxis axes = 5;
 // evidence_prompt_index points at the turn that evidences the suggestion.
 int32 evidence_prompt_index = 6;
}

// InvokedSkillJudgment is the judged assessment of one skill/command invoked
// during a session.
message InvokedSkillJudgment {
 // invocation_ref references the invocation within the session.
 string invocation_ref = 1;
 // artifact_name is the skill/command name.
 string artifact_name = 2;
 // source is how the skill was invoked (e.g. user-typed vs auto).
 string source = 3;
 // baseline_intent is what the skill is expected to do.
 string baseline_intent = 4;
 // contribution is what the invocation actually contributed.
 string contribution = 5;
 // artifact_type classifies the invoked artifact.
 HarnessArtifactType artifact_type = 6;
 // prompt_index points at the turn that invoked the skill.
 int32 prompt_index = 7;
 // evidence_prompt_index points at the turn that evidences this judgment.
 int32 evidence_prompt_index = 8;
 // input_contract is what the skill needed from the human's input.
 InputContract input_contract = 9;
 // contract_satisfied is whether the input contract was satisfied; unset when
 // not assessed.
 optional bool contract_satisfied = 10;
 // role is the role the skill played.
 SkillRole role = 11;
 // contract_compliance grades whether the skill met its contract.
 ContractCompliance contract_compliance = 12;
 // output_quality grades the skill's output.
 OutputQuality output_quality = 13;
 // execution_reliability grades how reliably the skill ran.
 ExecutionReliability execution_reliability = 14;
 // human_alignment grades how the human responded to the output.
 HumanAlignment human_alignment = 15;
 // skill_verdict is the overall verdict on the skill's contribution.
 SkillVerdict skill_verdict = 16;
}

// ArtifactAdjudication is the judged adjudication of one produced artifact and
// the review contract applied to it.
message ArtifactAdjudication {
 // artifact_ref references the adjudicated artifact.
 string artifact_ref = 1;
 // overall_attribution attributes what most drove the artifact's outcome.
 OverallAttribution overall_attribution = 2;
 // human_signal_present is whether a human acceptance/rejection signal exists.
 bool human_signal_present = 3;
 // findings_accepted is the count of review findings the author accepted.
 int32 findings_accepted = 4;
 // findings_rejected is the count of review findings the author rejected.
 int32 findings_rejected = 5;
 // findings_modified is the count of review findings the author modified.
 int32 findings_modified = 6;
 // findings_deferred is the count of review findings the author deferred.
 int32 findings_deferred = 7;
 // findings_unresolved is the count of review findings left unresolved.
 int32 findings_unresolved = 8;
 // gates_total is the count of contract gates evaluated.
 int32 gates_total = 9;
 // gates_violated is the count of contract gates violated.
 int32 gates_violated = 10;
 // gates_clause_not_real is the count of gate clauses judged not to be real
 // requirements.
 int32 gates_clause_not_real = 11;
 // contract_checks are the per-gate contract checks.
 repeated ContractCheck contract_checks = 12;
}

// ContractCheck is one gate-clause check within an ArtifactAdjudication.
message ContractCheck {
 // gate_ref references the gate clause checked.
 string gate_ref = 1;
 // clause_is_a_real_requirement is whether the clause is a genuine
 // requirement (vs a spurious one).
 bool clause_is_a_real_requirement = 2;
 // evidence_seq points at the evidence supporting the check.
 int32 evidence_seq = 3;
}

// HarnessFinding is one judged finding about how the harness helped or hurt a
// phase.
message HarnessFinding {
 // preference_signal is the observed preference the finding rests on.
 string preference_signal = 1;
 // agent_default is what the agent would do by default.
 string agent_default = 2;
 // author_preference is what the author preferred instead.
 string author_preference = 3;
 // invoked_skill names an invoked skill related to the finding, if any.
 string invoked_skill = 4;
 // both_valid is whether the agent default and author preference are both
 // valid.
 bool both_valid = 5;
 // attribution attributes the finding to harness, prompt, or model.
 FindingAttributionKind attribution = 6;
 // artifact_type classifies the related harness artifact.
 HarnessArtifactType artifact_type = 7;
 // artifact_relation relates the finding to that artifact.
 ArtifactRelation artifact_relation = 8;
 // phase_ref points at the phase the finding belongs to.
 int32 phase_ref = 9;
 // evidence_prompt_index points at the turn that evidences the finding.
 int32 evidence_prompt_index = 10;
 // phase_impact grades how the finding affected the phase.
 PhaseImpact phase_impact = 11;
 // visible_via records how the finding became visible.
 VisibleVia visible_via = 12;
}

// DiscardedRange is a contiguous span of turns the agent produced that was
// later discarded.
message DiscardedRange {
 // range_start is the first turn index in the discarded span (inclusive).
 int32 range_start = 1;
 // range_end is the last turn index in the discarded span (inclusive).
 int32 range_end = 2;
 // evidence_prompt_index points at the turn that evidences the discard.
 int32 evidence_prompt_index = 3;
 // reason is why the span was discarded.
 string reason = 4;
 // token_sum is the total tokens spent on the discarded span.
 int64 token_sum = 5;
}

// SignalCoverageCell is one cell of the signal-coverage matrix: how well one
// field of one signal set is covered at one grain for one tool.
message SignalCoverageCell {
 // signal_set is the signal set this cell reports on.
 SignalSet signal_set = 1;
 // numerator is the covered count.
 int32 numerator = 2;
 // denominator is the eligible count.
 int32 denominator = 3;
 // field_name is the field within the signal set this cell measures.
 string field_name = 4;
 // grain is the grain the cell reports at.
 CoverageGrain grain = 5;
 // tool is the coding tool the cell is scoped to (the IdeType set).
 sessionintelligence.common.v1.IdeType tool = 6;
 // provenance_tier grades the provenance of the covered signal.
 ProvenanceTier provenance_tier = 7;
 // coverage_state grades whether the field is measured, derived, estimated, or
 // absent.
 CoverageState coverage_state = 8;
}
